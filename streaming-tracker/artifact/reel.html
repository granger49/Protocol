function starRow(value, size) {

  return `<div style="display:flex;gap:1px">${out}</div>`
}
function starRowInteractive(groupId, value, size) {
  const s = size || 14
  let out = `<div id="${groupId}" data-value="${value}" style="display:flex;gap:3px">`
  for (let i = 1; i <= 5; i++) {
    const icon = (i <= value ? ICONS.star : ICONS.starEmpty).replace(/width="11" height="11"/, `width="${s}" height="${s}"`)
    out += `<button type="button" onclick="setStarRow('${groupId}',${i})" style="line-height:0;cursor:pointer" aria-label="${i} star">${icon}</button>`
  }
  return out + '</div>'
}
function setStarRow(groupId, value) {
  const el = document.getElementById(groupId)
  if (!el) return
  el.dataset.value = String(value)
  const size = (el.querySelector('svg') || {}).getAttribute ? el.querySelector('svg').getAttribute('width') : 14
  let html = ''
  for (let i = 1; i <= 5; i++) html += `<button type="button" onclick="setStarRow('${groupId}',${i})" style="line-height:0;cursor:pointer" aria-label="${i} star">${(i <= value ? ICONS.star : ICONS.starEmpty).replace(/width="11" height="11"/, `width="${size}" height="${size}"`)}</button>`
  el.innerHTML = html
}
function getStarRow(groupId) {
  const el = document.getElementById(groupId)
  return el ? Number(el.dataset.value || 0) : 0
}

const KEYS = { user: 'reel.user', posts: 'reel.posts', lists: 'reel.lists', comments: 'reel.comments', likes: 'reel.likes', dismissed: 'reel.dismissed' }
function uid(p) { return p + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8) }
function readKey(k, fb) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb } catch (e) { return fb } }
function writeKey(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} }

function getUser() { return readKey(KEYS.user, { id: 'me', name: 'Guy', onboarded: false, genres: [], lovedMovieIds: [], followedPeople: [] }) }
function saveUser(u) { writeKey(KEYS.user, u) }
function getPosts() { return readKey(KEYS.posts, []) }
function addPost(p) { const next = [p, ...getPosts()]; writeKey(KEYS.posts, next); return next }
function getLists() { return readKey(KEYS.lists, []) }
function createList(name) { const l = { id: uid('list'), name, createdAt: new Date().toISOString() }; writeKey(KEYS.lists, [...getLists(), l]); return l }
function deleteList(id) { writeKey(KEYS.lists, getLists().filter((l) => l.id !== id)) }
function getComments() { return readKey(KEYS.comments, []) }
function addComment(c) { const next = [...getComments(), c]; writeKey(KEYS.comments, next); return next }
function getLikes() { return readKey(KEYS.likes, {}) }
function toggleLike(postId) { const likes = getLikes(); likes[postId] = !likes[postId]; writeKey(KEYS.likes, likes); return likes }
function getDismissed() { return readKey(KEYS.dismissed, []) }
function dismissMovie(id) { const d = getDismissed(); if (!d.includes(id)) d.push(id); writeKey(KEYS.dismissed, d); return d }

function exportData() { return JSON.stringify({ user: getUser(), posts: getPosts(), lists: getLists(), comments: getComments(), exportedAt: new Date().toISOString() }, null, 2) }
function importData(json) { const d = JSON.parse(json); if (d.user) writeKey(KEYS.user, d.user); if (d.posts) writeKey(KEYS.posts, d.posts); if (d.lists) writeKey(KEYS.lists, d.lists); if (d.comments) writeKey(KEYS.comments, d.comments) }
function clearAllData() { Object.values(KEYS).forEach((k) => localStorage.removeItem(k)) }

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }
function findMovie(id) { return MOVIES.find((m) => m.id === id) }
function findMovieBySlug(slug) { return MOVIES.find((m) => m.slug === slug) }
function timeAgo(iso) {
  const hrs = Math.floor((Date.now() - new Date(iso).getTime()) / 3600e3)
  if (hrs < 1) return 'just now'
  if (hrs < 24) return hrs + 'h ago'

function hashStr(str) { let h = 0; for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0 } return h >>> 0 }
function recognizeFromPhoto(dataUrl) {
  return new Promise((resolve) => {
    setTimeout(() => {

      resolve(MOVIES[h % MOVIES.length])

}

      <button onclick="createListPrompt()" style="width:100%;margin-top:14px;height:42px;border-radius:10px;border:1px dashed #ADA89C;background:transparent;color:#7A756D;font-size:13px;font-weight:500;">+ New list</button>
    </div>`

function renderListDetail(id) {

function renderDiscover() {
  const user = getUser()
  const posted = new Set(getPosts().map((p) => p.movieId))
  const dismissed = new Set(getDismissed())
  const myMoods = new Set(user.genres)
  getPosts().forEach((p) => { const m = findMovie(p.movieId); if (m) m.moods.forEach((x) => myMoods.add(x)) })
  const candidates = MOVIES.filter((m) => !posted.has(m.id) && !dismissed.has(m.id)).slice(0, 8)
  const cards = candidates.map((m) => {
    const sharedMovie = MOVIES.find((x) => posted.has(x.id) && x.moods.some((mm) => m.moods.includes(mm)))
    const reason = sharedMovie ? `Because you loved ${esc(sharedMovie.title)}` : (m.moods.some((x) => myMoods.has(x)) ? `Matches your taste for ${esc(m.moods.find((x) => myMoods.has(x)))}` : 'New this week')
    return `<article style="display:flex;flex-direction:column;gap:10px;">
      <div style="display:flex;align-items:center;gap:6px;">${ICONS.sparkle}<span style="font-size:12px;font-weight:500;color:#7A756D;">${reason}</span></div>
      ${posterStill(m, { height: 280 })}
      <p style="margin:0;font-size:13px;color:#7A756D;">${esc(m.genre)} · ${m.moods.slice(0, 2).join(', ')}</p>
      <div style="display:flex;align-items:center;gap:10px;">
        <button onclick="discoverAddToList('${m.id}')" aria-label="Add to list" style="width:32px;height:32px;border-radius:8px;border:1px solid #E7E2D9;background:#FFFFFF;color:#43635C;display:flex;align-items:center;justify-content:center;">${ICONS.addlist}</button>
        <div style="flex:1;"></div>
        <button onclick="discoverDismiss('${m.id}')" aria-label="Not interested" style="width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:#ADA89C;display:flex;align-items:center;justify-content:center;">${ICONS.close}</button>
      </div>
    </article>`
  }).join('')
  const body = `
    <div style="flex-shrink:0;box-sizing:border-box;padding:10px 16px 12px;">
      <span style="font-size:12px;color:#7A756D;">Curated from today's web · updated this morning</span>
    </div>
    <div style="box-sizing:border-box;padding:0 16px 24px;display:flex;flex-direction:column;gap:22px;">
      ${candidates.length ? cards : `<p style="font-size:13px;color:#7A756D;text-align:center;padding:30px 10px;">You've seen everything in the demo catalog — nice work.</p>`}
    </div>`
  return tabShell('#/discover', 'Discover', `<span aria-hidden="true" style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#B08968;">${ICONS.sparkle.replace('width="13" height="13"', 'width="17" height="17"')}</span>`, body)
}
function discoverDismiss(id) { dismissMovie(id); renderRoute() }
function discoverAddToList(movieId) {

  root.id = 'quick-list-modal'
  const chips = lists.map((l) => `<button onclick="discoverAssignList('${movieId}','${l.id}')" style="height:34px;padding:0 14px;border-radius:9px;border:1.5px solid #E7E2D9;background:#FFFFFF;color:#24211E;font-size:13px;font-weight:500;">${esc(l.name)}</button>`).join('')

    <div style="width:100%;max-width:420px;background:#FFFFFF;border-radius:22px 22px 0 0;box-sizing:border-box;padding:16px 20px 32px;" onclick="event.stopPropagation()">

let activeStream = null

function startCamera() {
  const video = document.getElementById('camera-video')
  if (!video) return
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }).then((stream) => {
    activeStream = stream
    video.srcObject = stream
    video.play()
    const l = document.getElementById('camera-loading'); if (l) l.hidden = true
    const s = document.getElementById('shutter-btn'); if (s) s.disabled = false
  }).catch(() => {
    const f = document.getElementById('camera-fail'); if (f) f.hidden = false
    const l = document.getElementById('camera-loading'); if (l) l.hidden = true
  })
}
function shutterCapture() {
  const video = document.getElementById('camera-video')
  if (!video || !video.videoWidth) return
  const canvas = document.createElement('canvas')
  canvas.width = video.videoWidth; canvas.height = video.videoHeight
  canvas.getContext('2d').drawImage(video, 0, 0)
  handleCapturedPhoto(canvas.toDataURL('image/jpeg', 0.85))
}
function handleFileCapture(evt) {
  const file = evt.target.files && evt.target.files[0]
  if (!file) return
  const reader = new FileReader()
  reader.onload = () => handleCapturedPhoto(reader.result)
  reader.readAsDataURL(file)
}
function handleCapturedPhoto(dataUrl) {
  stopCamera()
  resetDraft()
  draftPost.photo = dataUrl
  navigate('#/confirm')
  recognizeFromPhoto(dataUrl).then((movie) => { draftPost.movie = movie; renderRoute() })
}

   PROFILE (incl. Settings — "not yet designed" in the brief, so designed here)
   ========================================================================= */
let settingsOpen = false
function renderProfile() {
  const u = getUser()
  const posts = getPosts()
  const lists = getLists()
  const topTags = (() => {
    const freq = {}
    posts.forEach((p) => { const m = findMovie(p.movieId); if (m) m.moods.forEach((t) => { freq[t] = (freq[t] || 0) + 1 }) })
    const fromRatings = Object.keys(freq).sort((a, b) => freq[b] - freq[a])
    return (fromRatings.length ? fromRatings : u.genres).slice(0, 4)
  })()
  function topPerson(field, roleField) {
    const scores = {}
    posts.forEach((p) => { const m = findMovie(p.movieId); if (!m) return; const person = m[roleField]; const val = p.ratings[field]; if (!val) return; if (!scores[person]) scores[person] = []; scores[person].push(val) })
    const names = Object.keys(scores)
    if (!names.length) return '—'
    names.sort((a, b) => (scores[b].reduce((s, v) => s + v, 0) / scores[b].length) - (scores[a].reduce((s, v) => s + v, 0) / scores[a].length))
    return names[0]
  }
  const topDirector = topPerson('directing', 'director')
  const topWriter = topPerson('writing', 'writer')
  const topCinematographer = topPerson('cinematography', 'cinematographer')
  const followedCount = u.followedPeople.length

  const friendMatches = FRIENDS.map((f) => {
    const theirs = new Set(FRIEND_MOODS[f.id] || [])
    const mine = new Set(topTags.length ? topTags : u.genres)
    if (mine.size === 0) return { f, pct: 0 }
    let shared = 0
    mine.forEach((t) => { if (theirs.has(t)) shared++ })
    const pct = Math.round((shared / mine.size) * 100)
    return { f, pct }
  }).filter((x) => x.pct > 0).sort((a, b) => b.pct - a.pct)
  const showMatch = posts.length > 0 && friendMatches.length > 0

  const firstYear = posts.length ? new Date(posts.map((p) => p.createdAt).sort()[0]).getFullYear() : new Date().getFullYear()

  const settingsHtml = settingsOpen ? `
    <div class="animate-pop" style="display:flex;flex-direction:column;gap:10px;border:1px solid #E7E2D9;border-radius:14px;padding:14px;margin-top:8px;">
      <label style="font-size:12px;color:#7A756D;">Display name<input id="settings-name" value="${esc(u.name)}" style="margin-top:4px;width:100%;box-sizing:border-box;border-radius:8px;border:1px solid #E7E2D9;background:#F6F4EF;padding:8px 10px;font-size:14px;color:#24211E;" /></label>
      <button onclick="settingsSave()" style="height:36px;border-radius:9px;background:#24211E;color:#F6F4EF;font-size:13px;font-weight:600;border:none;">Save</button>
      <p style="font-size:11px;color:#ADA89C;margin:4px 0 0;">Everything lives in this browser's local storage — nothing leaves your device yet.</p>
      <button onclick="settingsExport()" style="height:36px;border-radius:9px;border:1px solid #E7E2D9;background:#FFFFFF;color:#24211E;font-size:13px;">Export data (.json)</button>
      <button onclick="document.getElementById('settings-import-file').click()" style="height:36px;border-radius:9px;border:1px solid #E7E2D9;background:#FFFFFF;color:#24211E;font-size:13px;">Import data</button>
      <input id="settings-import-file" type="file" accept="application/json" style="display:none;" onchange="settingsImport(event)" />
      <button onclick="settingsClear()" style="height:36px;border-radius:9px;border:1px solid #C98B7A;background:#FFFFFF;color:#B25D53;font-size:13px;">Clear all data</button>
    </div>` : ''

  const body = `
    <div style="flex:1;box-sizing:border-box;padding:20px 16px 32px;display:flex;flex-direction:column;gap:22px;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;">
        ${avatarHtml(u.name, '#43635C', 72)}
        <div class="font-display" style="font-size:20px;font-weight:600;">${esc(u.name)}</div>
        <div style="font-size:12px;color:#7A756D;">${posts.length} film${posts.length === 1 ? '' : 's'} logged${posts.length ? ' since ' + firstYear : ''}</div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-around;padding:12px 0;border-top:1px solid #E7E2D9;border-bottom:1px solid #E7E2D9;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span class="font-display" style="font-size:17px;font-weight:600;">${posts.length}</span><span style="font-size:11px;color:#7A756D;">Films</span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span class="font-display" style="font-size:17px;font-weight:600;">${lists.length}</span><span style="font-size:11px;color:#7A756D;">Lists</span></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><span class="font-display" style="font-size:17px;font-weight:600;">${followedCount}</span><span style="font-size:11px;color:#7A756D;">Following</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;flex-direction:column;gap:2px;"><span class="font-display" style="font-size:16px;font-weight:600;">Your taste DNA</span><span style="font-size:12px;color:#7A756D;">Built from every rating you've left</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">${topTags.length ? topTags.map((t) => `<span style="height:26px;padding:0 11px;border-radius:8px;border:1px solid #E7E2D9;background:#FFFFFF;font-size:12px;font-weight:500;display:flex;align-items:center;">${esc(t)}</span>`).join('') : `<span style="font-size:12px;color:#ADA89C;">Nothing yet — rate a few films.</span>`}</div>
        <div style="display:flex;flex-direction:column;">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #EFEBE2;"><span style="font-size:13px;color:#7A756D;">You rate directing highest for</span><span style="font-size:13px;font-weight:600;">${esc(topDirector)}</span></div>
          <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #EFEBE2;"><span style="font-size:13px;color:#7A756D;">Writing you keep coming back to</span><span style="font-size:13px;font-weight:600;">${esc(topWriter)}</span></div>
          <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #EFEBE2;"><span style="font-size:13px;color:#7A756D;">Cinematography you're drawn to</span><span style="font-size:13px;font-weight:600;">${esc(topCinematographer)}</span></div>
          <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;"><span style="font-size:13px;color:#7A756D;">Actors you follow</span><span style="font-size:13px;font-weight:600;">${followedCount ? esc(u.followedPeople[0]) + (followedCount > 1 ? ' & ' + (followedCount - 1) + ' other' + (followedCount > 2 ? 's' : '') : '') : '—'}</span></div>
        </div>
      </div>
      ${showMatch ? `<div style="display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;flex-direction:column;gap:2px;"><span class="font-display" style="font-size:16px;font-weight:600;">Friend match</span><span style="font-size:12px;color:#7A756D;">How close your taste runs to theirs</span></div>
        ${friendMatches.map((x) => `<div style="display:flex;align-items:center;gap:10px;">
          ${avatarHtml(x.f.name, x.f.color, 30)}
          <span style="font-size:13px;font-weight:500;width:76px;flex-shrink:0;">${esc(x.f.name.split(' ')[0])}</span>
          <div style="flex:1;height:6px;border-radius:999px;background:#E7E2D9;overflow:hidden;"><div style="width:${x.pct}%;height:100%;background:#43635C;border-radius:999px;"></div></div>
          <span style="font-size:12px;font-weight:600;color:#43635C;width:32px;text-align:right;flex-shrink:0;">${x.pct}%</span>
        </div>`).join('')}
      </div>` : `<p style="font-size:12px;color:#ADA89C;">Rate a few films to see how your taste compares with friends.</p>`}
      <div>
        <button onclick="toggleSettings()" style="display:flex;align-items:center;gap:8px;background:none;border:none;padding:0;color:#7A756D;font-size:13px;font-weight:500;">${ICONS.settings}<span>Settings</span></button>
        ${settingsHtml}
      </div>
      <div style="border-top:1px solid #E7E2D9;padding-top:14px;">
        <p style="font-size:11px;color:#ADA89C;line-height:1.6;">About this build: recognition picks a plausible match from a small demo catalog instead of calling real OCR/TMDB. Friend-match uses shared taste tags and is hidden until you've rated something yourself. Cast and crew names are illustrative, not verified. This runs as one self-contained page so it opens instantly on your phone — a production build would move to Expo/React Native per the brief, with a real backend syncing posts across devices.</p>
      </div>
    </div>`
  return `<div style="min-height:100%;display:flex;flex-direction:column;">
    <div style="height:56px;flex-shrink:0;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #E7E2D9;" class="safe-top">
      <a href="#/" aria-label="Back to feed" style="width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#24211E;">${ICONS.back}</a>
      <div class="font-display" style="font-size:19px;font-weight:600;">Profile</div>
      <button onclick="toggleSettings()" aria-label="Settings" style="width:32px;height:32px;border-radius:999px;border:none;background:transparent;color:#7A756D;display:flex;align-items:center;justify-content:center;">${ICONS.settings}</button>
    </div>
    ${body}
  </div>`
}
function toggleSettings() { settingsOpen = !settingsOpen; renderRoute() }
function settingsSave() {
  const u = getUser()
  u.name = (document.getElementById('settings-name') || {}).value || u.name
  saveUser(u)
  renderRoute()
}
async function settingsExport() {
  const downloads = window.claude ? await window.claude.use('downloads').catch(() => null) : null
  if (!downloads) { alert("Export isn't available in this view. Try opening this page in a full browser tab."); return }
  try { await downloads.save({ filename: 'reel-data.json', data: exportData() }) } catch (e) { if (e && e.code === 'declined') return; alert('Could not save the file: ' + (e && e.message ? e.message : 'unknown error')) }
}
function settingsImport(evt) {
  const file = evt.target.files && evt.target.files[0]
  if (!file) return
  const reader = new FileReader()
  reader.onload = () => { try { importData(reader.result); location.reload() } catch (e) { alert('Could not read that file.') } }
  reader.readAsText(file)
}
function settingsClear() {
  if (!confirm('Clear all local data? This resets onboarding and removes your posts, lists and ratings.')) return
  clearAllData()
  location.reload()
}

/* =========================================================================
   INIT
   ========================================================================= */
window.addEventListener('hashchange', renderRoute)
document.addEventListener('DOMContentLoaded', renderRoute)
</script>
