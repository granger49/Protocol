const KEYS = { user: 'reel.user', lists: 'reel.lists', listItems: 'reel.listItems', reviews: 'reel.reviews' }

function uid(prefix) { return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8) }

function readKey(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback } catch (e) { return fallback }
}
function writeKey(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)) } catch (e) { /* storage unavailable, session still works in-memory */ }
}

function getUser() { return readKey(KEYS.user, { id: 'me', name: 'You', handle: 'you' }) }
function saveUser(u) { writeKey(KEYS.user, u) }

function ensureDefaultLists() {
  const user = getUser()
  const lists = DEFAULT_LISTS.map((d) => ({ id: uid('list'), ownerId: user.id, name: d.name, kind: d.kind, visibility: d.visibility, createdAt: new Date().toISOString() }))
  writeKey(KEYS.lists, lists)
  return lists
}
function getLists() {
  const lists = readKey(KEYS.lists, [])
  return lists.length === 0 ? ensureDefaultLists() : lists
}
function createList(name, visibility) {
  const user = getUser()
  const list = { id: uid('list'), ownerId: user.id, name, kind: 'custom', visibility, createdAt: new Date().toISOString() }
  const next = [...getLists(), list]
  writeKey(KEYS.lists, next)
  return { lists: next, list }
}
function updateListVisibility(listId, visibility) {
  const next = getLists().map((l) => (l.id === listId ? { ...l, visibility } : l))
  writeKey(KEYS.lists, next)
  return next
}
function renameList(listId, name) {
  const next = getLists().map((l) => (l.id === listId ? { ...l, name } : l))
  writeKey(KEYS.lists, next)
  return next
}
function deleteList(listId) {
  writeKey(KEYS.lists, getLists().filter((l) => l.id !== listId))
  writeKey(KEYS.listItems, getListItems().filter((i) => i.listId !== listId))
}
function getListItems() { return readKey(KEYS.listItems, []) }
function addToList(listId, showId, extra) {
  extra = extra || {}
  const filtered = getListItems().filter((i) => !(i.listId === listId && i.showId === showId))
  const item = { id: uid('item'), listId, showId, photo: extra.photo || null, note: extra.note || '', addedAt: new Date().toISOString() }
  const next = [item, ...filtered]
  writeKey(KEYS.listItems, next)
  return next
}
function moveToDefaultList(showId, kind, extra) {
  extra = extra || {}
  const lists = getLists()
  const defaultIds = new Set(lists.filter((l) => l.kind !== 'custom').map((l) => l.id))
  const target = lists.find((l) => l.kind === kind)
  if (!target) return getListItems()
  const items = getListItems().filter((i) => !(defaultIds.has(i.listId) && i.showId === showId))
  const item = { id: uid('item'), listId: target.id, showId, photo: extra.photo || null, note: extra.note || '', addedAt: new Date().toISOString() }
  const next = [item, ...items]
  writeKey(KEYS.listItems, next)
  return next
}
function removeFromList(listId, showId) {
  const next = getListItems().filter((i) => !(i.listId === listId && i.showId === showId))
  writeKey(KEYS.listItems, next)
  return next
}
function getReviews() { return readKey(KEYS.reviews, []) }
function addReview(review) {
  const next = [review, ...getReviews().filter((r) => !(r.showId === review.showId && r.authorId === review.authorId))]
  writeKey(KEYS.reviews, next)
  return next
}
function exportData() {
  return JSON.stringify({ user: getUser(), lists: getLists(), listItems: getListItems(), reviews: getReviews(), exportedAt: new Date().toISOString() }, null, 2)
}
function importData(json) {
  const data = JSON.parse(json)
  if (data.user) writeKey(KEYS.user, data.user)
  if (data.lists) writeKey(KEYS.lists, data.lists)
  if (data.listItems) writeKey(KEYS.listItems, data.listItems)
  if (data.reviews) writeKey(KEYS.reviews, data.reviews)
}
function clearAllData() { Object.values(KEYS).forEach((k) => localStorage.removeItem(k)) }

  if (!el) return

function hashString(str) {
  let hash = 0
  for (let i = 0; i < str.length; i++) { hash = (hash << 5) - hash + str.charCodeAt(i); hash |= 0 }
  return hash >>> 0
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0
    let t = Math.imul(a ^ (a >>> 15), 1 | a)
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}
function recognizeFromPhoto(dataUrl) {
  return new Promise((resolve) => {
    setTimeout(() => {
      const seed = hashString(dataUrl.slice(-2000))
      const rand = mulberry32(seed)
      const shuffled = [...SHOWS].sort(() => rand() - 0.5)
      const top = shuffled.slice(0, 3)
      const confidences = [0.7 + rand() * 0.25, 0.35 + rand() * 0.25, 0.15 + rand() * 0.15].sort((a, b) => b - a)
      resolve(top.map((show, i) => ({ show, confidence: Math.min(0.98, confidences[i]) })))
    }, 900 + Math.random() * 700)
  })
}
function searchShows(query) {
  const q = query.trim().toLowerCase()
  if (!q) return []
  return SHOWS.filter((s) => s.title.toLowerCase().includes(q) || s.genres.some((g) => g.toLowerCase().includes(q)) || s.platforms.some((p) => p.toLowerCase().includes(q))).slice(0, 8)
}

function publicShowUrl(slug) {

function makeQrDataUrl(text) {
  return new Promise((resolve, reject) => {
    QRCode.toDataURL(text, { margin: 1, width: 480, color: { dark: '#0b0d12ff', light: '#ffffffff' } }, (err, url) => {
      if (err) reject(err); else resolve(url)

}

/* =========================================================================
   ROUTER
   ========================================================================= */
function parseHash() {
  const h = (location.hash || '#/').replace(/^#/, '') || '/'
  const parts = h.split('/').filter(Boolean)
  return parts
}
function navigate(hash) { location.hash = hash }

function renderRoute() {
  stopCamera()
  const parts = parseHash()
  const app = document.getElementById('app')
  try {
    if (parts.length === 0) { app.innerHTML = renderHome(); return }
    if (parts[0] === 'lists' && parts.length === 1) { app.innerHTML = renderLists(); return }
    if (parts[0] === 'lists' && parts.length === 2) { app.innerHTML = renderListDetail(parts[1]); return }
    if (parts[0] === 'capture') { app.innerHTML = renderCapture(); return }
    if (parts[0] === 'friends' && parts.length === 1) { app.innerHTML = renderFriends(); return }
    if (parts[0] === 'friends' && parts.length === 2) { app.innerHTML = renderFriendProfile(parts[1]); return }
    if (parts[0] === 'friends' && parts.length === 4 && parts[2] === 'lists') { app.innerHTML = renderFriendListDetail(parts[1], parts[3]); return }
    if (parts[0] === 'show' && parts.length === 2) { app.innerHTML = renderShowDetail(parts[1]); return }
    if (parts[0] === 'profile') { app.innerHTML = renderProfile(); return }
    if (parts[0] === 's' && parts.length === 2) { app.innerHTML = renderPublicShow(parts[1]); return }
    app.innerHTML = renderHome()
  } finally {
    afterRender()
  }
}
let pendingAfterRender = null
function afterRender() {
  if (pendingAfterRender) { const fn = pendingAfterRender; pendingAfterRender = null; fn() }
}

            <div class="text-right flex-shrink-0"><p class="text-lg font-semibold text-accent">${Math.round(top.confidence * 100)}%</p><p class="text-[10px] text-white/40">match</p></div>
          </button>

        ${rest.length ? `<div><p class="text-xs uppercase tracking-wide text-white/40 mb-2">Other possibilities</p><div class="flex flex-col gap-2">
          ${rest.map((c) => `<button onclick="selectCandidate('${c.show.id}')" class="flex items-center gap-3 rounded-xl border border-line bg-panel p-2.5 text-left">
            ${posterHtml(c.show, 'sm')}<div class="min-w-0 flex-1"><p class="text-sm font-medium">${esc(c.show.title)}</p><p class="text-xs text-white/40">${c.show.year}</p></div><p class="text-sm text-white/40 flex-shrink-0">${Math.round(c.confidence * 100)}%</p>

  } else if (captureState.step === 'compose') {

function startCamera() {
  const video = document.getElementById('camera-video')
  if (!video) return
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }).then((stream) => {
    if (captureState.step !== 'capture') { stream.getTracks().forEach((t) => t.stop()); return }
    activeStream = stream
    video.srcObject = stream
    video.play()
    const loading = document.getElementById('camera-loading'); if (loading) loading.hidden = true
    const shutterBtn = document.getElementById('shutter-btn'); if (shutterBtn) shutterBtn.disabled = false
  }).catch(() => {
    const fail = document.getElementById('camera-fail'); if (fail) fail.hidden = false
    const wrap = document.getElementById('camera-wrap')
    if (wrap) { const loading = document.getElementById('camera-loading'); if (loading) loading.hidden = true }
  })
}
function shutterCapture() {
  const video = document.getElementById('camera-video')
  if (!video || !video.videoWidth) return
  const canvas = document.createElement('canvas')
  canvas.width = video.videoWidth
  canvas.height = video.videoHeight
  const ctx = canvas.getContext('2d')
  ctx.drawImage(video, 0, 0)
  handleCapturedPhoto(canvas.toDataURL('image/jpeg', 0.85))
}
function handleFileCapture(evt) {
  const file = evt.target.files && evt.target.files[0]
  if (!file) return
  const reader = new FileReader()
  reader.onload = () => handleCapturedPhoto(reader.result)
  reader.readAsDataURL(file)
}
function handleCapturedPhoto(dataUrl) {
  stopCamera()
  captureState.photo = dataUrl
  captureState.step = 'recognizing'
  renderRoute()
  recognizeFromPhoto(dataUrl).then((results) => {
    if (captureState.step !== 'recognizing') return
    captureState.candidates = results
    captureState.step = 'confirm'
    renderRoute()
  })
}
function selectCandidate(showId) {
  captureState.show = findShowById(showId)
  captureState.selectedListId = null
  captureState.step = 'compose'
  renderRoute()
}
function renderCaptureSearchResults(query) {
  const results = searchShows(query)
  const el = document.getElementById('capture-search-results')
  if (!el) return
  el.innerHTML = results.map((show) => `<button onclick="selectCandidate('${show.id}')" class="flex items-center gap-3 rounded-xl border border-line bg-panel p-2.5 text-left w-full">
    ${posterHtml(show, 'sm')}<div class="min-w-0 flex-1"><p class="text-sm font-medium">${esc(show.title)}</p><p class="text-xs text-white/40">${esc(show.platforms.join(', '))}</p></div>
  </button>`).join('')
}
function pickComposeList(listId) {
  captureState.selectedListId = listId
  const container = document.getElementById('compose-list-picker')
  if (!container) return
  Array.from(container.querySelectorAll('button[data-list-id]')).forEach((btn) => {
    const active = btn.dataset.listId === listId
    btn.className = 'flex items-center justify-between rounded-xl border px-3 py-2.5 text-left transition-colors ' + (active ? 'border-accent2/50 bg-accent2/10' : 'border-line')
  })
}
function composeCreateList() {
  const name = document.getElementById('compose-newlist-name').value.trim()
  if (!name) return
  const { list } = createList(name, 'friends')
  captureState.selectedListId = list.id
  renderRoute()
}
function submitCapturePost() {
  const show = captureState.show
  const listId = captureState.selectedListId
  if (!show || !listId) return
  const lists = getLists()
  const list = lists.find((l) => l.id === listId)
  if (!list) return
  const note = (document.getElementById('compose-note') || {}).value || ''
  const rating = getStars('compose-stars')
  const photo = captureState.photo

  if (list.kind !== 'custom') moveToDefaultList(show.id, list.kind, { photo, note })
  else addToList(list.id, show.id, { photo, note })

  if (rating) {
    const user = getUser()
    addReview({ id: uid('rev'), showId: show.id, authorId: user.id, rating, text: note, createdAt: new Date().toISOString() })
  }

  captureState.postedListName = list.name
  captureState.step = 'done'
  renderRoute()
}

function profileSave() {
  const name = document.getElementById('profile-name').value
  const handle = document.getElementById('profile-handle').value
  saveUser({ ...getUser(), name, handle })
  const btn = document.getElementById('profile-save-btn')
  if (btn) { const orig = btn.textContent; btn.textContent = 'Saved ✓'; setTimeout(() => { btn.textContent = orig }, 1200) }
}
async function profileExport() {
  const downloads = window.claude ? await window.claude.use('downloads').catch(() => null) : null
  if (!downloads) { alert("Export isn't available in this view. Try opening this page in a full browser tab."); return }
  try {
    await downloads.save({ filename: 'reel-data.json', data: exportData() })
  } catch (e) {
    if (e && e.code === 'declined') return
    alert('Could not save the file: ' + (e && e.message ? e.message : 'unknown error'))
  }
}
function profileImport(evt) {
  const file = evt.target.files && evt.target.files[0]
  if (!file) return
  const reader = new FileReader()
  reader.onload = () => {
    try { importData(reader.result); location.reload() } catch (e) { alert('Could not read that file.') }
  }
  reader.readAsText(file)
}
function profileClear() {
  if (!confirm('Clear all local data? This removes your lists, ratings, and reviews.')) return
  clearAllData()
  location.reload()
}
